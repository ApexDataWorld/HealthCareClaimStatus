[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "HealthCareClaimStatus"
version = "0.1.0"
description = "Claims Status with LangGraph, MCP, and RAG"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "langchain-community>=0.0.10",
    "langchain-anthropic>=0.1.0",
    "langgraph>=0.0.60",
    "chromadb>=0.4.0",
    "sentence-transformers>=3.0.0",
    "httpx>=0.25.0",
    "tenacity>=8.2.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src"]
